[project]
name = "ANYaudiobook"
version = "0.1.0"
description = "A Python tool to convert ebooks to audiobooks using Microsoft Edge's Text-to-Speech engine."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = "~=3.14.0"
dependencies = [
    "beautifulsoup4==4.15.0",
    "ebooklib==0.21",
    "edge-tts==7.3.1",
    "mutagen==1.48.1",
    "pydantic==2.14.3"
]

[dependency-groups]
dev = [
    "ruff==0.17.5",
    "ty==0.0.104"
]
