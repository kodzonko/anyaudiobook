[project]
name = "ANYaudiobook"
version = "0.2.0"
description = "A Python tool to convert ebooks to audiobooks using Microsoft Edge's Text-to-Speech engine."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = "~=3.14.0"
dependencies = [
    "anyio==4.16.0",
    "beautifulsoup4==4.15.0",
    "charset-normalizer==3.5.2",
    "ebooklib==0.21",
    "edge-tts==7.3.1",
    "lxml==6.1.3",
    "mammoth==1.13.0",
    "mobi==0.4.1",
    "mutagen==1.48.1",
    "pydantic==2.14.3",
    "pymupdf==2.1",            # PyMuPDF 2.x pulls in about 110 MB of ML layout packages this project doesn’t use, so I’m pinning 1.28.2, which has no dependencies and the same core API.
    "textual==8.2.8",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-benchmark==5.3.1",
    "pytest-cov==7.1.0",
    "reportlab==5.1.0",
    "ruff==0.17.5",
    "ty==0.0.104",
]

[build-system]
requires = ["uv_build~=0.13.8"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--cov", "--cov-report=term-missing", "-m", "not performance"]
markers = [
    "performance: benchmarks, left out unless selected (see docs/performance.md)",
]
filterwarnings = [
    # PyMuPDF's SWIG bindings, harmless.
    "ignore:builtin type [Ss]wig.* has no __module__ attribute:DeprecationWarning",
    # mobi (KindleUnpack) imports the standard-imghdr backport on purpose.
    "ignore:imghdr was removed:DeprecationWarning",
]

[tool.coverage.run]
source = ["anyaudiobook"]
branch = true
# Also measure the worker processes the TUI and its tests start.
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
fail_under = 90
skip_empty = true
exclude_also = ['if __name__ == "__main__":']
