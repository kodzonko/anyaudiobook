[project]
name = "ANYaudiobook"
version = "0.1.0"
description = "A Python tool to convert ebooks to audiobooks using Microsoft Edge's Text-to-Speech engine."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = "~=3.14.0"
dependencies = [
    "beautifulsoup4>=4.13.4",
    "black>=26.10.1",
    "ebooklib>=0.19",
    "edge-tts>=7.0.2",
    "marimo>=0.23.9",
    "mutagen>=1.47.0",
    "pydantic>=2.11.7"
]

[dependency-groups]
dev = ["isort>=6.0.0", "mypy>=1.15.0", "ruff>=0.12.0"]
