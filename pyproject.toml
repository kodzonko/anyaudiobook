[project]
name = "ANYaudiobook"
version = "0.2.0"
description = "A Python tool to convert ebooks to audiobooks using Microsoft Edge's Text-to-Speech engine."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = "~=3.14.0"
dependencies = [
    "anyio==4.16.0",
    "beautifulsoup4==4.15.0",
    "ebooklib==0.21",
    "edge-tts==7.3.1",
    "mutagen==1.48.1",
    "pydantic==2.14.3"
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.5",
    "ty==0.0.104"
]

[build-system]
requires = ["uv_build~=0.13.8"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--cov", "--cov-report=term-missing"]

[tool.coverage.run]
source = ["anyaudiobook"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
skip_empty = true
exclude_also = ['if __name__ == "__main__":']
